# Локальная разработка (hot reload). Не использовать на VPS.
# Запуск: docker compose -f docker-compose.dev.yml up --build
# или:   npm run dev:docker

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      DB_PATH: /app/data/cms.db
      # Hot reload на Docker Desktop (Windows/macOS)
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      # Linux-native node_modules (не смешивать с Windows/macOS host)
      - dev_node_modules:/app/node_modules
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    command: ["npm", "run", "dev", "--", "-H", "0.0.0.0", "-p", "3000"]

volumes:
  dev_node_modules:
